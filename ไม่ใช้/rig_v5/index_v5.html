<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Tiger PNGTuber</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #222; }
  #stage { position: absolute; inset: 0; display: flex; justify-content: center; align-items: flex-end; }
  #avatar { position: relative; width: 1024px; height: 1536px; transform-origin: 50% 100%; }
  #avatar img, #head, #face { position: absolute; pointer-events: none; user-select: none; }
  #head { left: 0; top: 0; width: 1024px; height: 1536px; transform-origin: 480px 850px; will-change: transform; }
  #face { left: 0; top: 0; width: 1024px; height: 1536px; transform-origin: 480px 500px; will-change: transform; }
  #faceImg { left: 265px; top: 215px; }
  #earL { left: 150px; top: 80px; transform-origin: 104px 251px; will-change: transform; }
  #earR { left: 590px; top: 80px; transform-origin: 173px 306px; will-change: transform; }
  #eyeLc, #eyeRc { opacity: 0; }
  /* ไดคัทตาเป็นวงรีขอบฟุ้ง กันขอบสี่เหลี่ยมของสไปรต์โผล่ตอนกะพริบ */
  #eyeLo, #eyeLc, #eyeRo, #eyeRc {
    -webkit-mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 60%, transparent 92%);
    mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 60%, transparent 92%);
  }
  #eyeLo { left: 294px; top: 446px; transform-origin: 54px 66px; will-change: transform; }
  #eyeLc { left: 294px; top: 446px; }
  #eyeRo { left: 456px; top: 442px; transform-origin: 93px 63px; will-change: transform; }
  #eyeRc { left: 456px; top: 442px; }
  .mouth{ left: 380px; top: 690px; opacity: 0; }
  /* ลูกตาดำตามเมาส์: หน้าต่างวงรีค้างนิ่งตรงตาดำ แล้วเลื่อนภาพตาข้างในแทน */
  #pupilLw, #pupilRw { position: absolute; will-change: transform;
    -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; }
  #pupilLw { left: 294px; top: 446px; width: 108px; height: 106px; transform-origin: 54px 66px;
    -webkit-mask-image: radial-gradient(ellipse 34px 28px at 88px 61px, #000 55%, transparent 100%);
    mask-image: radial-gradient(ellipse 34px 28px at 88px 61px, #000 55%, transparent 100%); }
  #pupilRw { left: 456px; top: 442px; width: 186px; height: 110px; transform-origin: 93px 63px;
    -webkit-mask-image: radial-gradient(ellipse 42px 30px at 122px 72px, #000 55%, transparent 100%);
    mask-image: radial-gradient(ellipse 42px 30px at 122px 72px, #000 55%, transparent 100%); }
  #pupilL { left: -24px; top: -24px; } /* padded source: sprite art starts at (24,24) */
  #pupilR { left: 0; top: 0; }

  #bar { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%);
         display: flex; gap: 10px; align-items: center; padding: 8px 14px;
         background: rgba(20,20,20,.82); border-radius: 12px; font: 14px system-ui, sans-serif;
         color: #eee; transition: opacity .4s; z-index: 10; }
  #bar.hidden { opacity: 0; pointer-events: none; }
  #bar button { border: 0; border-radius: 8px; padding: 6px 12px; cursor: pointer;
                background: #444; color: #eee; font: inherit; }
  #bar button.on { background: #2e7d46; }
  .sw { width: 22px; height: 22px; border-radius: 6px; border: 2px solid #666; cursor: pointer; }
  #meterWrap { width: 90px; height: 8px; background: #333; border-radius: 4px; overflow: hidden; }
  #meter { height: 100%; width: 0%; background: #4caf7d; }
  #sens { width: 110px; }
  #hint { position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
          color: #bbb; font: 13px system-ui, sans-serif; background: rgba(20,20,20,.6);
          padding: 6px 12px; border-radius: 8px; transition: opacity 1s; z-index: 10; }
  #demoBadge { position: fixed; top: 12px; right: 12px; z-index: 20; display: none;
               background: #c62828; color: #fff; font: bold 15px system-ui, sans-serif;
               padding: 10px 14px; border-radius: 10px; cursor: pointer; }
  #dot { position: fixed; left: 10px; bottom: 10px; width: 14px; height: 14px;
         border-radius: 50%; background: #c33; z-index: 30; display: none; }
  #debug { position: fixed; top: 10px; left: 10px; color: #6f6; font: 13px monospace;
           background: rgba(0,0,0,.75); padding: 8px 12px; border-radius: 8px;
           z-index: 30; white-space: pre; display: none; }
</style>
</head>
<body>
<div id="stage">
  <div id="avatar">
    <img id="body" src="body.png">
    <div id="head">
      <img id="earL" src="ear_left.png">
      <img id="earR" src="ear_right.png">
      <img id="headImg" src="head.png">
      <div id="face">
        <img id="faceImg" src="face.png">
        <img id="eyeLc" src="eyeL_closed.png">
        <img id="eyeRc" src="eyeR_closed.png">
        <img id="eyeLo" src="eyeL_open.png">
        <img id="eyeRo" src="eyeR_open.png">
        <div id="pupilLw"><img id="pupilL" src="pupilL_src.png"></div>
        <div id="pupilRw"><img id="pupilR" src="eyeR_open.png"></div>
        <img class="mouth" src="mouth_0.png" style="opacity:1">
        <img class="mouth" src="mouth_1.png">
        <img class="mouth" src="mouth_2.png">
        <img class="mouth" src="mouth_3.png">
        <img class="mouth" src="mouth_4.png">
      </div>
    </div>
  </div>
</div>

<div id="bar">
  <span id="wsState" style="color:#888">🔗 ตัวช่วย: -</span>
  <button id="micBtn">🎤 เปิดไมค์</button>
  <div id="meterWrap"><div id="meter"></div></div>
  <label>ความไว <input id="sens" type="range" min="1" max="20" step="0.5"></label>
  <span style="color:#888">พื้นหลัง:</span>
  <div class="sw" data-bg="#00b140" style="background:#00b140"></div>
  <div class="sw" data-bg="#0047bb" style="background:#0047bb"></div>
  <div class="sw" data-bg="#222222" style="background:#222"></div>
  <div class="sw" data-bg="#ffffff" style="background:#fff"></div>
</div>
<div id="hint">กด 🎤 เปิดไมค์แล้วพูด = ปากขยับตามเสียง · ขยับเมาส์ = หันหน้า · เอาเมาส์ชิดขอบล่างเรียกแถบเครื่องมือ</div>
<div id="demoBadge">⚠ โหมดทดสอบ — ปาก/หัวขยับเอง ไม่ฟังเมาส์และไมค์<br>คลิกที่นี่เพื่อกลับโหมดใช้งานจริง</div>
<div id="dot"></div>
<div id="debug"></div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const avatar = $("avatar"), head = $("head"), face = $("face");
const mouthImgs = [...document.querySelectorAll(".mouth")];
const params = new URLSearchParams(location.search);

// OBS Browser Source mode (auto-detected): transparent background, no UI
const obsMode = params.has("obs") || !!window.obsstudio;
if (obsMode) {
  document.documentElement.style.background = "transparent";
  document.body.style.background = "transparent";
  $("bar").style.display = "none";
  $("hint").style.display = "none";
  // helper-connection dot for the first 25s (green = helper linked, red = not)
  $("dot").style.display = "block";
  setTimeout(() => $("dot").style.display = "none", 25000);
}
const debugMode = params.has("debug");
if (debugMode) $("debug").style.display = "block";

// ---------- helper link (global mic + mouse via ws://127.0.0.1:8765) ----------
let wsData = null, wsAt = -1e9;
(function connectWS() {
  let ws;
  try { ws = new WebSocket("ws://127.0.0.1:8765"); } catch (e) { setTimeout(connectWS, 3000); return; }
  ws.onmessage = e => { wsData = JSON.parse(e.data); wsAt = performance.now(); };
  ws.onclose = () => setTimeout(connectWS, 2000);
  ws.onerror = () => ws.close();
})();
const wsFresh = now => wsData && (now - wsAt) < 1200;

// ---------- scale to fit ----------
function fit() {
  avatar.style.transform = `scale(${Math.min(innerWidth / 1024, innerHeight / 1536)})`;
}
addEventListener("resize", fit); fit();

// ---------- small physics + noise helpers ----------
class Spring {
  constructor() { this.p = 0; this.v = 0; }
  step(target, dt, w, z) {
    this.v += (w * w * (target - this.p) - 2 * z * w * this.v) * dt;
    this.p += this.v * dt;
    return this.p;
  }
}
// organic drift: layered incommensurate sines, |nz| <= 1
const nz = (t, a, b, c) =>
  Math.sin(t * a) * 0.55 + Math.sin(t * b + 1.7) * 0.3 + Math.sin(t * c + 4.1) * 0.15;

// ---------- crossfade stack (mouth) ----------
function setStack(imgs, f) {
  f = Math.max(0, Math.min(imgs.length - 1, f));
  const i = Math.floor(f), frac = f - i;
  for (let k = 0; k < imgs.length; k++)
    imgs[k].style.opacity = (k === i) ? 1 : (k === i + 1) ? frac : 0;
}

// ---------- blink: squash + late lid fade, randomized character ----------
let blinkPhase = "idle", blinkStart = 0, nextBlink = performance.now() + 2000;
let blinkDepth = 1, tClose = 90, tHold = 70, tOpen = 140;
const easeIn = t => t * t, easeOut = t => 1 - (1 - t) * (1 - t);
const forceBlink = parseFloat(new URLSearchParams(location.search).get("blink"));
function applyBlink(p) {
  const q = Math.max(0, Math.min(1, (p - 0.3) / 0.5));
  const s = Math.max(0.03, 1 - p);
  const oOp = p < 0.85 ? 1 : Math.max(0, (1 - p) / 0.15);
  $("eyeLc").style.opacity = q; $("eyeRc").style.opacity = q;
  $("eyeLo").style.transform = `scaleY(${s})`; $("eyeLo").style.opacity = oOp;
  $("eyeRo").style.transform = `scaleY(${s})`; $("eyeRo").style.opacity = oOp;
  $("pupilLw").style.transform = `scaleY(${s})`; $("pupilLw").style.opacity = oOp;
  $("pupilRw").style.transform = `scaleY(${s})`; $("pupilRw").style.opacity = oOp;
}
function scheduleBlink(now) {
  const half = Math.random() < 0.15;
  blinkDepth = half ? 0.55 + Math.random() * 0.15 : 0.92 + Math.random() * 0.08;
  tClose = 70 + Math.random() * 45;
  tHold = 40 + Math.random() * 55;
  tOpen = 115 + Math.random() * 85;
  nextBlink = now + 2000 + Math.random() * 4800 + (Math.random() < 0.18 ? -1700 : 0);
}
function tickBlink(now) {
  if (!isNaN(forceBlink)) { applyBlink(forceBlink); return; }
  let p = 0;
  if (blinkPhase === "idle" && now >= nextBlink) { blinkPhase = "closing"; blinkStart = now; }
  if (blinkPhase === "closing") {
    const t = (now - blinkStart) / tClose;
    if (t >= 1) { blinkPhase = "hold"; blinkStart = now; p = 1; } else p = easeIn(t);
  } else if (blinkPhase === "hold") {
    p = 1;
    if (now - blinkStart >= tHold) { blinkPhase = "opening"; blinkStart = now; }
  } else if (blinkPhase === "opening") {
    const t = (now - blinkStart) / tOpen;
    if (t >= 1) { blinkPhase = "idle"; p = 0; scheduleBlink(now); }
    else p = 1 - easeOut(t);
  }
  applyBlink(p * blinkDepth);
}

// ---------- mouse ----------
let nx = 0, ny = 0;
addEventListener("mousemove", e => {
  nx = (e.clientX / innerWidth - 0.5) * 2;
  ny = (e.clientY / innerHeight - 0.5) * 2;
});

// ---------- mic ----------
let analyser = null, audioData = null, level = 0, smooth = 0, prevSmooth = 0, openness = 0;
const sens = $("sens");
sens.value = parseFloat(params.get("sens")) || localStorage.tigerSens || 8;
sens.oninput = () => localStorage.tigerSens = sens.value;
$("micBtn").onclick = async () => {
  if (analyser) { analyser = null; $("micBtn").textContent = "🎤 เปิดไมค์"; $("micBtn").classList.remove("on"); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
    const ctx = new AudioContext();
    ctx.createMediaStreamSource(stream).connect(analyser = ctx.createAnalyser());
    analyser.fftSize = 1024;
    audioData = new Float32Array(analyser.fftSize);
    $("micBtn").textContent = "🎤 ไมค์ทำงาน"; $("micBtn").classList.add("on");
  } catch (err) { alert("เปิดไมค์ไม่ได้: " + err.message); }
};
function tickMic(now) {
  if (wsFresh(now)) {                       // helper delivers global mic level
    level = wsData.level * sens.value * 1.2;
  } else if (analyser) {
    analyser.getFloatTimeDomainData(audioData);
    let sum = 0;
    for (let i = 0; i < audioData.length; i++) sum += audioData[i] * audioData[i];
    level = Math.sqrt(sum / audioData.length) * sens.value;
  } else { level = 0; }
  smooth = level > smooth ? smooth * 0.5 + level * 0.5 : smooth * 0.86 + level * 0.14;
  $("meter").style.width = Math.min(100, smooth * 100) + "%";
}

// ---------- springs & state ----------
const sRot = new Spring(), sX = new Spring(), sY = new Spring();
const fRot = new Spring(), fX = new Spring(), fY = new Spring();
const sEar = new Spring();
let flickVel = { L: 0, R: 0 }, nextFlick = performance.now() + 4000, perkAt = 0;

const demo = location.search.includes("demo");
let demoT = 0;
if (demo) {
  const b = $("demoBadge");
  b.style.display = "block";
  b.style.pointerEvents = "auto";
  b.onclick = () => location.href = location.pathname;
}

// ---------- main loop ----------
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const t = now / 1000;

  if (demo) {
    demoT += dt;
    nx = Math.sin(demoT * 0.8) * 0.85;
    ny = Math.sin(demoT * 0.5) * 0.5;
    smooth = Math.max(0, Math.sin(demoT * 5.5)) * (0.4 + 0.6 * Math.abs(Math.sin(demoT * 0.7)));
    $("meter").style.width = Math.min(100, smooth * 100) + "%";
  } else {
    if (wsFresh(now)) {                     // helper delivers global mouse position
      nx = Math.max(-1, Math.min(1, ((wsData.mx - wsData.vx) / wsData.vw - 0.5) * 2));
      ny = Math.max(-1, Math.min(1, ((wsData.my - wsData.vy) / wsData.vh - 0.5) * 2));
    }
    tickMic(now);
  }
  const linked = wsFresh(now);
  $("wsState").textContent = linked ? "🔗 ตัวช่วย: เชื่อมต่อ ✓" : "🔗 ตัวช่วย: -";
  $("dot").style.background = linked ? "#2e7d46" : "#c33";
  if (debugMode) {
    $("debug").textContent =
      `obs: ${obsMode}  helper: ${linked ? "CONNECTED" : "NOT FOUND"}\n` +
      `level: ${level.toFixed(3)}  smooth: ${smooth.toFixed(3)}\n` +
      `mouse: ${nx.toFixed(2)}, ${ny.toFixed(2)}` +
      (wsData ? `  (global ${wsData.mx},${wsData.my})` : "");
  }
  tickBlink(now);

  // ear perk when voice starts
  if (smooth > 0.22 && prevSmooth <= 0.22 && now > perkAt) {
    flickVel.L += 140; flickVel.R -= 140;
    perkAt = now + 2500;
  }
  prevSmooth = smooth;

  // mouth: gamma curve + flutter while talking
  const targetO = Math.pow(Math.max(0, Math.min(1, (smooth - 0.05) * 1.75)), 0.8);
  openness += (targetO - openness) * (1 - Math.pow(targetO > openness ? 0.0001 : 0.008, dt));
  const flutter = (Math.sin(now / 45) * Math.sin(now / 97 + 1)) * 0.07
                  * Math.min(1, openness * 3) * Math.min(1, (1 - openness) * 3);
  setStack(mouthImgs, Math.max(0, Math.min(1, openness + flutter)) * (mouthImgs.length - 1));

  // head: mouse target + organic idle drift, spring with light overshoot
  const rT = nx * 2.2 + nz(t, 0.23, 0.52, 0.89) * 0.45;
  const xT = nx * 7 + nz(t, 0.19, 0.44, 0.83) * 2.2;
  const yT = ny * 5 + nz(t, 0.28, 0.60, 1.10) * 1.6;
  const hr = sRot.step(rT, dt, 6, 0.85);
  const hx = sX.step(xT, dt, 6, 0.85);
  const hy = sY.step(yT, dt, 6, 0.85);
  const breath = Math.sin(t * 1.65) * 2.2;
  head.style.transform =
    `translate(${hx}px, ${hy + breath - openness * 3}px) rotate(${hr}deg)`;

  // face parallax: deeper, laggier layer inside the hood
  const fr = fRot.step(nx * 0.5, dt, 4.2, 0.8);
  const fx = fX.step(nx * 5.5 + nz(t, 0.17, 0.41, 0.79) * 1.1, dt, 4.2, 0.8);
  const fy = fY.step(ny * 4.2 + nz(t, 0.26, 0.55, 1.03) * 0.9, dt, 4.2, 0.8);
  const fBreath = Math.sin(t * 1.65 + 0.7) * 1.1;
  face.style.transform =
    `translate(${fx}px, ${fy + fBreath - openness * 1.5}px) rotate(${fr}deg)`;

  // pupils: slide the eye art behind a fixed iris-window (eyes lead, head lags)
  // sqrt curve = ตาตวัดไวตั้งแต่เมาส์ขยับนิดเดียว แล้วอิ่มตัวที่ขอบจอ
  const gx = Math.sign(nx) * Math.sqrt(Math.abs(nx));
  const gy = Math.sign(ny) * Math.sqrt(Math.abs(ny));
  const pTx = `translate(${gx * 9}px, ${gy * 5}px)`;
  $("pupilL").style.transform = pTx;
  $("pupilR").style.transform = pTx;

  // ears: wiggly spring chasing head rotation + slow drift + flicks
  const earT = hr * 1.4 + nz(t, 0.15, 0.37, 0.71) * 1.8;
  const earP = sEar.step(earT, dt, 11, 0.35);
  if (now >= nextFlick) {
    flickVel[Math.random() < 0.5 ? "L" : "R"] += (Math.random() < 0.5 ? 1 : -1) * 220;
    nextFlick = now + 3500 + Math.random() * 8000;
  }
  for (const s of ["L", "R"]) {
    flickVel[s] *= Math.pow(0.0005, dt);
    if (Math.abs(flickVel[s]) < 0.5) flickVel[s] = 0;
  }
  const wig = Math.sin(now / 90);
  $("earL").style.transform = `rotate(${(earP - hr) + flickVel.L * 0.02 * wig}deg)`;
  $("earR").style.transform = `rotate(${(earP - hr) + flickVel.R * 0.02 * wig}deg)`;

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ---------- toolbar ----------
if (!obsMode) document.body.style.background = localStorage.tigerBg || "#222222";
document.querySelectorAll(".sw").forEach(el => {
  el.onclick = () => { document.body.style.background = el.dataset.bg; localStorage.tigerBg = el.dataset.bg; };
});
let barTimer = 0;
function pokeBar() {
  $("bar").classList.remove("hidden");
  clearTimeout(barTimer);
  barTimer = setTimeout(() => $("bar").classList.add("hidden"), 3500);
}
addEventListener("mousemove", e => { if (e.clientY > innerHeight - 120) pokeBar(); });
pokeBar();
setTimeout(() => $("hint").style.opacity = 0, 9000);
</script>
</body>
</html>
